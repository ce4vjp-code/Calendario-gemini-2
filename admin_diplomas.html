<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo de Diplomas - Panel de Administración</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body { padding: 2rem; background-color: var(--bg-main); display: block; height: auto !important; overflow: auto !important; min-height: 100vh; }
        .admin-container { background: var(--bg-card); padding: 2.5rem; border-radius: 1rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); max-width: 1200px; margin: 0 auto; }
        h2 { color: var(--primary-color); margin-bottom: 1rem; }
        
        .diploma-editor {
            display: flex;
            gap: 2rem;
            margin-top: 2rem;
            flex-wrap: wrap;
        }

        .controls-panel {
            flex: 1;
            min-width: 300px;
            background: #f8fafc;
            padding: 1.5rem;
            border-radius: 0.5rem;
            border: 1px solid var(--border-color);
        }

        .canvas-container {
            flex: 2;
            min-width: 600px;
            border: 2px dashed var(--border-color);
            background: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            position: relative;
        }

        canvas {
            max-width: 100%;
            height: auto;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .control-group {
            margin-bottom: 1.5rem;
            padding-bottom: 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }
        
        .control-group:last-child {
            border-bottom: none;
            padding-bottom: 0;
            margin-bottom: 0;
        }

        .flex-row {
            display: flex;
            gap: 1rem;
            margin-bottom: 0.5rem;
        }
        
        .flex-row > div {
            flex: 1;
        }

        label {
            font-weight: 600;
            font-size: 0.9rem;
            color: var(--text-color);
            display: block;
            margin-bottom: 0.5rem;
        }
        
        input[type="text"], input[type="number"], input[type="color"] {
            width: 100%;
            padding: 0.5rem;
            border: 1px solid var(--border-color);
            border-radius: 0.25rem;
        }
        
        .btn-upload {
            background: var(--color-trabajo);
            color: white;
            padding: 0.75rem 1rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            width: 100%;
            font-weight: 600;
            margin-top: 1rem;
        }
        
        .btn-print {
            background: var(--color-control);
            color: white;
            padding: 1rem;
            border: none;
            border-radius: 0.5rem;
            cursor: pointer;
            width: 100%;
            font-size: 1.1rem;
            font-weight: bold;
            margin-top: 1rem;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 0.5rem;
        }

        #upload-status {
            margin-top: 0.5rem;
            font-size: 0.9rem;
            text-align: center;
        }

        /* Estilos de Impresión */
        @media print {
            body { padding: 0; background: white; margin: 0; display: block; }
            .admin-container { box-shadow: none; padding: 0; margin: 0; max-width: none; border-radius: 0; background: transparent; }
            .controls-panel, h2, p, .btn-print, .header-actions, .return-link { display: none !important; }
            .canvas-container { border: none; background: transparent; padding: 0; margin: 0; width: 100%; height: 100%; }
            .diploma-editor { display: block; margin: 0; }
            canvas { max-width: none; width: 100vw; height: auto; box-shadow: none; display: block; margin: 0 auto; page-break-inside: avoid; }
            @page { size: landscape; margin: 0; }
        }
    </style>
</head>
<body>
    <div class="admin-container">
        <div class="header-actions" style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem;">
            <div>
                <h2>Módulo de Diplomas</h2>
                <p style="color: var(--text-muted);">Sube una plantilla, ajusta los textos y genera el diploma.</p>
            </div>
            <div>
                <a href="admin.html" class="btn-submit" style="text-decoration:none; background:var(--bg-main); color: var(--text-color); border: 1px solid var(--border-color);">Volver al Panel</a>
            </div>
        </div>

        <div class="diploma-editor">
            <div class="controls-panel">
                <div class="control-group">
                    <h3>1. Plantilla</h3>
                    <div style="margin-bottom: 1rem;">
                        <label>Seleccionar Plantilla Guardada</label>
                        <div style="display: flex; gap: 0.5rem; align-items: center; width: 100%;">
                            <select id="template-select" onchange="changeTemplate()" style="flex: 1; min-width: 0; text-overflow: ellipsis; overflow: hidden; white-space: nowrap;">
                                <option value="">Cargando plantillas...</option>
                            </select>
                            <button type="button" onclick="deleteTemplate()" title="Eliminar plantilla" style="background: var(--danger); color: white; border: none; padding: 0.5rem 0.8rem; border-radius: 0.25rem; cursor: pointer; flex-shrink: 0;">
                                <i class="fa-solid fa-trash"></i>
                            </button>
                        </div>
                    </div>
                    
                    <form id="form-template" enctype="multipart/form-data" style="border-top: 1px dashed var(--border-color); padding-top: 1rem;">
                        <label style="margin-bottom: 0.5rem; font-weight: normal; font-size: 0.85rem; color: var(--text-muted);">O subir una nueva (JPG/PNG)</label>
                        <input type="file" id="template-file" accept="image/jpeg, image/png">
                        <button type="submit" class="btn-upload" id="btn-upload-template">
                            <i class="fa-solid fa-upload"></i> Subir Nueva Plantilla
                        </button>
                        <div id="upload-status"></div>
                    </form>
                </div>

                <div class="control-group">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                        <h3 style="margin: 0;">2. Textos del Diploma</h3>
                        <button type="button" onclick="addDynamicField()" style="background: var(--color-trabajo); color: white; border: none; padding: 0.4rem 0.8rem; border-radius: 0.25rem; cursor: pointer; font-size: 0.8rem; display: flex; gap: 0.5rem; align-items: center;">
                            <i class="fa-solid fa-plus"></i> Agregar
                        </button>
                    </div>
                    <div id="dynamic-fields-container" style="display: flex; flex-direction: column; gap: 1rem;">
                        <!-- Dynamic fields inserted here via JS -->
                    </div>
                </div>

                <button class="btn-print" onclick="window.print()">
                    <i class="fa-solid fa-print"></i> Imprimir Diploma
                </button>
            </div>

            <div class="canvas-container">
                <canvas id="diploma-canvas"></canvas>
            </div>
        </div>
        
        <div class="return-link" style="margin-top: 3rem; border-top: 1px solid var(--border-color); padding-top: 1rem;">
            <a href="admin.html" style="color: var(--text-muted); text-decoration: none;">← Volver al Panel de Administración</a>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('diploma-canvas');
        const ctx = canvas.getContext('2d');
        let bgImage = new Image();
        let fieldCount = 0;

        // Verificar si es admin o diplomas
        async function checkAdmin() {
            try {
                const response = await fetch('api/check_session.php?t=' + new Date().getTime(), { credentials: 'same-origin' });
                const text = await response.text();
                const data = JSON.parse(text);
                if (!data.authenticated || !['admin', 'diplomas'].includes(data.user.rol)) {
                    alert('Acceso denegado.');
                    window.location.href = 'index.html';
                } else {
                    if (data.user.rol === 'diplomas') {
                        // Cambiar enlaces de volver por cerrar sesión
                        const headerLink = document.querySelector('.header-actions a');
                        if(headerLink) {
                            headerLink.innerHTML = '<i class="fa-solid fa-right-from-bracket"></i> Cerrar Sesión';
                            headerLink.href = '#';
                            headerLink.onclick = async (e) => {
                                e.preventDefault();
                                await fetch('api/logout.php');
                                window.location.href = 'login.html';
                            };
                        }
                        const footerLink = document.querySelector('.return-link a');
                        if(footerLink) {
                            footerLink.textContent = '← Cerrar Sesión';
                            footerLink.href = '#';
                            footerLink.onclick = async (e) => {
                                e.preventDefault();
                                await fetch('api/logout.php');
                                window.location.href = 'login.html';
                            };
                        }
                    }
                    
                    loadTemplates();
                    // Agregar campo por defecto si está vacío
                    if (document.getElementById('dynamic-fields-container').children.length === 0) {
                        addDynamicField('Nombre del Alumno', 'Juan Pérez González', 100, '#000000', 1000, 650);
                    }
                }
            } catch (e) {
                alert('Error de red al comprobar sesión.');
                window.location.href = 'index.html';
            }
        }
        checkAdmin();

        // Cargar plantillas guardadas en el servidor
        async function loadTemplates() {
            try {
                const res = await fetch('api/diplomas/get_templates.php?t=' + new Date().getTime());
                const data = await res.json();
                const select = document.getElementById('template-select');
                select.innerHTML = '';
                
                if (data.success && data.templates.length > 0) {
                    data.templates.forEach(t => {
                        const option = document.createElement('option');
                        option.value = t.url;
                        option.textContent = t.name;
                        select.appendChild(option);
                    });
                    changeTemplate();
                } else {
                    select.innerHTML = '<option value="">No hay plantillas guardadas</option>';
                    ctx.clearRect(0, 0, canvas.width, canvas.height);
                    bgImage.src = '';
                }
            } catch(e) {
                console.error("No se pudieron cargar las plantillas", e);
            }
        }
        
        function changeTemplate() {
            const select = document.getElementById('template-select');
            if(select.value) {
                bgImage.crossOrigin = "Anonymous";
                bgImage.src = select.value + '?t=' + new Date().getTime();
                bgImage.onload = () => {
                    canvas.width = bgImage.width;
                    canvas.height = bgImage.height;
                    drawDiploma();
                };
            }
        }

        async function deleteTemplate() {
            const select = document.getElementById('template-select');
            const filename = select.options[select.selectedIndex]?.text;
            
            if (!filename || filename === 'No hay plantillas guardadas') {
                alert('No hay plantilla seleccionada para eliminar.');
                return;
            }

            if (!confirm(`¿Estás seguro de que deseas eliminar la plantilla "${filename}"?`)) return;

            try {
                const response = await fetch('api/diplomas/delete_template.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ filename })
                });
                const data = await response.json();
                if (data.success) {
                    alert(data.message);
                    loadTemplates();
                } else {
                    alert("Error: " + data.error);
                }
            } catch(e) {
                alert("Error de red al eliminar plantilla.");
            }
        }

        // Subir plantilla
        document.getElementById('form-template').addEventListener('submit', async (e) => {
            e.preventDefault();
            const fileInput = document.getElementById('template-file');
            const status = document.getElementById('upload-status');
            const btn = document.getElementById('btn-upload-template');
            
            if (!fileInput.files[0]) {
                status.textContent = 'Selecciona un archivo (JPG/PNG) primero.';
                status.style.color = 'red';
                return;
            }

            const formData = new FormData();
            formData.append('template', fileInput.files[0]);

            btn.disabled = true;
            btn.textContent = 'Subiendo...';

            try {
                const response = await fetch('api/diplomas/upload_template.php', {
                    method: 'POST',
                    body: formData
                });
                
                const data = await response.json();
                
                if (data.success) {
                    status.textContent = 'Plantilla guardada correctamente.';
                    status.style.color = 'green';
                    fileInput.value = ''; // Limpiar input
                    await loadTemplates(); // Recargar la lista
                    
                    // Seleccionar la nueva plantilla subida
                    const select = document.getElementById('template-select');
                    for (let i = 0; i < select.options.length; i++) {
                        if (select.options[i].text === data.file) {
                            select.selectedIndex = i;
                            changeTemplate();
                            break;
                        }
                    }
                } else {
                    status.textContent = data.error || 'Error al subir plantilla';
                    status.style.color = 'red';
                }
            } catch (error) {
                status.textContent = 'Error de conexión.';
                status.style.color = 'red';
            } finally {
                btn.disabled = false;
                btn.innerHTML = '<i class="fa-solid fa-upload"></i> Subir Nueva Plantilla';
            }
        });

        // Dynamic Fields Logic
        function addDynamicField(labelStr = 'Nuevo Texto', textVal = 'Texto de ejemplo', sizeVal = 100, colorVal = '#000000', xVal = 1000, yVal = 650) {
            fieldCount++;
            const id = fieldCount;
            const container = document.getElementById('dynamic-fields-container');
            
            const fieldHTML = `
                <div class="dynamic-field" id="field-${id}" style="background: white; border: 1px solid var(--border-color); border-radius: 0.5rem; padding: 1rem;">
                    <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 0.5rem;">
                        <input type="text" id="label-${id}" value="${labelStr}" style="border: none; background: transparent; font-weight: 600; padding: 0; outline: none; width: auto;" placeholder="Etiqueta (ej. Nombre)">
                        <button type="button" onclick="removeDynamicField(${id})" style="background: transparent; color: var(--danger); border: none; cursor: pointer;" title="Eliminar Campo">
                            <i class="fa-solid fa-times"></i>
                        </button>
                    </div>
                    
                    <input type="text" id="text-${id}" value="${textVal}" oninput="drawDiploma()">
                    
                    <div style="margin-top: 1rem;">
                        <label>Posición Horizontal (X)</label>
                        <div style="display: flex; gap: 0.5rem; align-items: center;">
                            <input type="range" id="x-slider-${id}" min="0" max="4000" value="${xVal}" oninput="document.getElementById('x-${id}').value = this.value; drawDiploma();" style="flex: 1; margin: 0;">
                            <input type="number" id="x-${id}" value="${xVal}" oninput="document.getElementById('x-slider-${id}').value = this.value; drawDiploma();" style="width: 80px;">
                        </div>
                    </div>
                    
                    <div style="margin-top: 0.5rem;">
                        <label>Posición Vertical (Y)</label>
                        <div style="display: flex; gap: 0.5rem; align-items: center;">
                            <input type="range" id="y-slider-${id}" min="0" max="4000" value="${yVal}" oninput="document.getElementById('y-${id}').value = this.value; drawDiploma();" style="flex: 1; margin: 0;">
                            <input type="number" id="y-${id}" value="${yVal}" oninput="document.getElementById('y-slider-${id}').value = this.value; drawDiploma();" style="width: 80px;">
                        </div>
                    </div>
                    
                    <div style="margin-top: 0.5rem; display: flex; gap: 1rem;">
                        <div style="flex: 1;">
                            <label>Tamaño de Letra</label>
                            <div style="display: flex; gap: 0.5rem; align-items: center;">
                                <input type="range" id="size-slider-${id}" min="10" max="400" value="${sizeVal}" oninput="document.getElementById('size-${id}').value = this.value; drawDiploma();" style="flex: 1; margin: 0;">
                                <input type="number" id="size-${id}" value="${sizeVal}" oninput="document.getElementById('size-slider-${id}').value = this.value; drawDiploma();" style="width: 70px;">
                            </div>
                        </div>
                        <div>
                            <label>Color</label>
                            <input type="color" id="color-${id}" value="${colorVal}" oninput="drawDiploma()" style="width: 60px; height: 38px; padding: 0;">
                        </div>
                    </div>
                </div>
            `;
            
            container.insertAdjacentHTML('beforeend', fieldHTML);
            drawDiploma();
        }

        function removeDynamicField(id) {
            const field = document.getElementById(`field-${id}`);
            if (field) {
                field.remove();
                drawDiploma();
            }
        }

        // Dibujar en el canvas
        function drawDiploma() {
            if (!bgImage.src) return;

            // Limpiar canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            
            // Dibujar fondo
            ctx.drawImage(bgImage, 0, 0);

            // Configuraciones de texto comunes
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';

            // Dibujar todos los campos dinámicos
            const fields = document.querySelectorAll('.dynamic-field');
            fields.forEach(field => {
                const id = field.id.split('-')[1];
                const text = document.getElementById(`text-${id}`).value;
                const x = document.getElementById(`x-${id}`).value;
                const y = document.getElementById(`y-${id}`).value;
                const size = document.getElementById(`size-${id}`).value;
                const color = document.getElementById(`color-${id}`).value;
                
                ctx.font = `bold ${size}px Arial, sans-serif`;
                ctx.fillStyle = color;
                ctx.fillText(text, x, y);
            });
        }
        
        // Eventos para arrastrar con el mouse
        let isDragging = false;
        let dragFieldId = null;
        let dragOffsetX = 0;
        let dragOffsetY = 0;

        function getCanvasCoordinates(e) {
            const rect = canvas.getBoundingClientRect();
            // Calcular escala (las dimensiones reales vs el tamaño en pantalla)
            const scaleX = canvas.width / rect.width;
            const scaleY = canvas.height / rect.height;
            
            return {
                x: (e.clientX - rect.left) * scaleX,
                y: (e.clientY - rect.top) * scaleY
            };
        }

        canvas.addEventListener('mousedown', (e) => {
            const { x, y } = getCanvasCoordinates(e);
            
            // Revisar campos en orden inverso (para seleccionar el que está "arriba" visualmente)
            const fields = Array.from(document.querySelectorAll('.dynamic-field')).reverse();
            
            for (const field of fields) {
                const id = field.id.split('-')[1];
                const text = document.getElementById(`text-${id}`).value;
                const fieldX = parseFloat(document.getElementById(`x-${id}`).value);
                const fieldY = parseFloat(document.getElementById(`y-${id}`).value);
                const size = parseFloat(document.getElementById(`size-${id}`).value);
                
                ctx.font = `bold ${size}px Arial, sans-serif`;
                const metrics = ctx.measureText(text);
                
                const halfWidth = metrics.width / 2;
                // Aproximación de altura (size) para no complicar el hit-box
                const height = size;
                const top = fieldY - height / 2;
                const bottom = fieldY + height / 2;
                const left = fieldX - halfWidth;
                const right = fieldX + halfWidth;
                
                if (x >= left && x <= right && y >= top && y <= bottom) {
                    isDragging = true;
                    dragFieldId = id;
                    dragOffsetX = x - fieldX;
                    dragOffsetY = y - fieldY;
                    canvas.style.cursor = 'grabbing';
                    return; // Se detiene al encontrar el primer campo
                }
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            const { x, y } = getCanvasCoordinates(e);
            
            if (isDragging && dragFieldId) {
                const newX = Math.round(x - dragOffsetX);
                const newY = Math.round(y - dragOffsetY);
                
                document.getElementById(`x-${dragFieldId}`).value = newX;
                document.getElementById(`x-slider-${dragFieldId}`).value = newX;
                document.getElementById(`y-${dragFieldId}`).value = newY;
                document.getElementById(`y-slider-${dragFieldId}`).value = newY;
                
                drawDiploma();
            } else {
                // Cambiar el cursor a "manito" si pasamos sobre algo que se puede arrastrar
                let hovered = false;
                const fields = document.querySelectorAll('.dynamic-field');
                for (const field of fields) {
                    const id = field.id.split('-')[1];
                    const text = document.getElementById(`text-${id}`).value;
                    const fieldX = parseFloat(document.getElementById(`x-${id}`).value);
                    const fieldY = parseFloat(document.getElementById(`y-${id}`).value);
                    const size = parseFloat(document.getElementById(`size-${id}`).value);
                    
                    ctx.font = `bold ${size}px Arial, sans-serif`;
                    const metrics = ctx.measureText(text);
                    const halfWidth = metrics.width / 2;
                    const height = size; 
                    
                    if (x >= fieldX - halfWidth && x <= fieldX + halfWidth && y >= fieldY - height / 2 && y <= fieldY + height / 2) {
                        hovered = true;
                        break;
                    }
                }
                canvas.style.cursor = hovered ? 'grab' : 'default';
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
            dragFieldId = null;
            canvas.style.cursor = 'default';
        });

        canvas.addEventListener('mouseleave', () => {
            isDragging = false;
            dragFieldId = null;
            canvas.style.cursor = 'default';
        });

        // Evento para cambiar tamaño con la rueda del ratón (scroll)
        canvas.addEventListener('wheel', (e) => {
            const { x, y } = getCanvasCoordinates(e);
            
            // Revisar si estamos sobre algún texto (orden inverso)
            const fields = Array.from(document.querySelectorAll('.dynamic-field')).reverse();
            
            for (const field of fields) {
                const id = field.id.split('-')[1];
                const text = document.getElementById(`text-${id}`).value;
                const fieldX = parseFloat(document.getElementById(`x-${id}`).value);
                const fieldY = parseFloat(document.getElementById(`y-${id}`).value);
                const size = parseFloat(document.getElementById(`size-${id}`).value);
                
                ctx.font = `bold ${size}px Arial, sans-serif`;
                const metrics = ctx.measureText(text);
                
                const halfWidth = metrics.width / 2;
                const height = size;
                const top = fieldY - height / 2;
                const bottom = fieldY + height / 2;
                const left = fieldX - halfWidth;
                const right = fieldX + halfWidth;
                
                if (x >= left && x <= right && y >= top && y <= bottom) {
                    // Prevenir el scroll de la página si estamos cambiando el tamaño
                    e.preventDefault();
                    
                    // Determinar dirección del scroll (arriba = aumentar, abajo = disminuir)
                    // e.deltaY negativo significa que el scroll es hacia arriba
                    let newSize = size + (e.deltaY < 0 ? 5 : -5);
                    
                    // Limitar tamaño (mínimo 10, máximo 400)
                    newSize = Math.max(10, Math.min(400, newSize));
                    
                    document.getElementById(`size-${id}`).value = newSize;
                    document.getElementById(`size-slider-${id}`).value = newSize;
                    
                    drawDiploma();
                    return; // Solo aplicar al campo superior
                }
            }
        }, { passive: false }); // passive: false es necesario para usar e.preventDefault()
    </script>
</body>
</html>
