<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Administración de Horarios</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        body { padding: 2rem; background-color: var(--bg-main); display: block; height: auto !important; overflow: auto !important; min-height: 100vh; }
        .admin-container { background: var(--bg-card); padding: 2.5rem; border-radius: 1rem; box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); max-width: 1000px; margin: 0 auto; }
        h2 { color: var(--primary-color); margin-bottom: 1rem; }
        
        .management-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; margin-bottom: 2rem; }
        
        .horario-table { width: 100%; border-collapse: collapse; margin-top: 1rem; text-align: center; }
        .horario-table th, .horario-table td { border: 1px solid var(--border-color); padding: 0.5rem; }
        .horario-table th { background: #f8fafc; font-weight: 600; color: var(--text-main); }
        .horario-cell { min-height: 60px; border-radius: 4px; display: flex; flex-direction: column; align-items: center; justify-content: center; cursor: pointer; transition: background 0.2s; font-size: 0.85rem; padding: 4px; }
        .horario-cell:hover { background: #e2e8f0; }
        .horario-cell.empty { background: transparent; }
        
        .recreo-row td { background: #f1f5f9; font-style: italic; color: var(--text-muted); font-size: 0.8rem; }
        
        /* Modal simple para asignar clase */
        .modal-asignar { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); align-items: center; justify-content: center; z-index: 100; }
        .modal-asignar.show { display: flex; }
        .modal-content-asignar { background: white; padding: 2rem; border-radius: 8px; width: 300px; }
    </style>
</head>
<body>
    <div class="admin-container">
        <div style="display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 2rem;">
            <div>
                <h2>Gestión de Horarios</h2>
                <p style="color: var(--text-muted);">Crea cursos, asignaturas y arma la malla semanal.</p>
            </div>
            <div style="display: flex; gap: 10px;">
                <a href="admin.html" class="btn-submit" style="text-decoration:none; background:var(--text-muted);">Usuarios</a>
                <a href="#" id="btn-logout" class="btn-submit" style="text-decoration:none; background:var(--danger);">Salir</a>
            </div>
        </div>
        
        <div class="management-grid">
            <!-- Cursos -->
            <div>
                <h3>1. Cursos</h3>
                <form id="form-curso" style="display:flex; gap:10px; margin-top:10px;">
                    <input type="text" id="nombre-curso" placeholder="Ej: 1 Medio A" required style="padding:0.5rem; border:1px solid #ccc; border-radius:4px; flex:1;">
                    <button type="submit" style="padding:0.5rem 1rem; background:var(--primary-color); color:white; border:none; border-radius:4px; cursor:pointer;">Añadir</button>
                </form>
                <ul id="lista-cursos" style="list-style:none; padding:0; margin-top:10px; max-height:200px; overflow-y:auto;">
                    <!-- Llenado JS -->
                </ul>
            </div>
            
            <!-- Asignaturas -->
            <div>
                <h3>2. Asignaturas</h3>
                <form id="form-asignatura" style="display:flex; gap:10px; margin-top:10px;">
                    <input type="text" id="nombre-asignatura" placeholder="Ej: Matemáticas" required style="padding:0.5rem; border:1px solid #ccc; border-radius:4px; flex:1;">
                    <input type="color" id="color-asignatura" value="#4f46e5" style="padding:0; border:none; border-radius:4px; cursor:pointer; height:35px; width:40px;">
                    <button type="submit" style="padding:0.5rem 1rem; background:var(--primary-color); color:white; border:none; border-radius:4px; cursor:pointer;">Añadir</button>
                </form>
                <ul id="lista-asignaturas" style="list-style:none; padding:0; margin-top:10px; max-height:200px; overflow-y:auto;">
                    <!-- Llenado JS -->
                </ul>
            </div>
        </div>
        
        <hr style="border:0; border-top:1px solid var(--border-color); margin:2rem 0;">
        
        <!-- Constructor de Horario -->
        <div>
            <h3>3. Armar Horario</h3>
            <div style="margin-top: 1rem; margin-bottom: 1rem;">
                <label for="select-curso">Selecciona un Curso: </label>
                <select id="select-curso" style="padding:0.5rem; border-radius:4px; border:1px solid #ccc;">
                    <option value="">Seleccione...</option>
                </select>
            </div>
            
            <table class="horario-table" id="tabla-horario" style="display:none;">
                <thead>
                    <tr>
                        <th style="width: 100px;">Horario</th>
                        <th>Lunes</th>
                        <th>Martes</th>
                        <th>Miércoles</th>
                        <th>Jueves</th>
                        <th>Viernes</th>
                    </tr>
                </thead>
                <tbody id="tbody-horario">
                    <!-- Filas generadas por JS -->
                </tbody>
            </table>
        </div>
    </div>

    <!-- Modal para asignar asignatura a un bloque -->
    <div id="modal-asignar" class="modal-asignar">
        <div class="modal-content-asignar">
            <h3 style="margin-bottom:1rem; color:var(--primary-color);">Asignar Clase</h3>
            <p id="modal-info-bloque" style="font-size:0.85rem; color:var(--text-muted); margin-bottom:1rem;"></p>
            
            <div style="margin-bottom:1rem;">
                <label>Asignatura:</label>
                <select id="modal-select-asignatura" style="width:100%; padding:0.5rem; margin-top:5px; border:1px solid #ccc; border-radius:4px;">
                    <option value="">[ LIBRE ]</option>
                </select>
            </div>
            
            <div style="display:flex; justify-content:flex-end; gap:10px;">
                <button onclick="closeModal()" style="padding:0.5rem 1rem; border:none; border-radius:4px; cursor:pointer; background:#ccc;">Cancelar</button>
                <button id="btn-delete-clase" style="padding:0.5rem 1rem; border:none; border-radius:4px; cursor:pointer; background:var(--danger); color:white; display:none;">Eliminar</button>
                <button id="btn-save-clase" style="padding:0.5rem 1rem; border:none; border-radius:4px; cursor:pointer; background:var(--primary-color); color:white;">Guardar</button>
            </div>
        </div>
    </div>

    <script>
        const bloques = [
            { id: 1, hora: "08:30 - 09:15" },
            { id: 2, hora: "09:15 - 10:00" },
            { id: 0, hora: "10:00 - 10:20", label: "RECREO" },
            { id: 3, hora: "10:20 - 11:05" },
            { id: 4, hora: "11:05 - 11:50" },
            { id: 0, hora: "11:50 - 12:00", label: "RECREO" },
            { id: 5, hora: "12:00 - 12:45" },
            { id: 6, hora: "12:45 - 13:30" },
            { id: 0, hora: "13:30 - 14:25", label: "ALMUERZO" },
            { id: 7, hora: "14:25 - 15:10" },
            { id: 8, hora: "15:10 - 15:55" }
        ];

        let cursos = [];
        let asignaturas = [];
        let currentCursoId = 0;
        let currentModalData = { dia: 0, bloque: 0 };

        async function checkAdmin() {
            try {
                const response = await fetch('api/check_session.php?t=' + new Date().getTime());
                const data = await response.json();
                if (!data.authenticated || data.user.rol !== 'admin') {
                    window.location.href = 'index.html';
                } else {
                    init();
                }
            } catch (e) {
                window.location.href = 'index.html';
            }
        }
        checkAdmin();

        async function init() {
            await loadCursos();
            await loadAsignaturas();
            renderTabla();
        }

        // Cursos
        async function loadCursos() {
            const res = await fetch('api/horarios/admin_get_cursos.php');
            const data = await res.json();
            if(data.success) {
                cursos = data.data;
                const ul = document.getElementById('lista-cursos');
                const sel = document.getElementById('select-curso');
                ul.innerHTML = '';
                sel.innerHTML = '<option value="">Seleccione...</option>';
                cursos.forEach(c => {
                    ul.innerHTML += `<li style="padding:5px; border-bottom:1px solid #eee; display:flex; justify-content:space-between;">
                        ${c.nombre} <button onclick="deleteCurso(${c.id})" style="color:red; background:none; border:none; cursor:pointer;"><i class="fa fa-trash"></i></button>
                    </li>`;
                    sel.innerHTML += `<option value="${c.id}">${c.nombre}</option>`;
                });
            }
        }

        document.getElementById('form-curso').addEventListener('submit', async(e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombre-curso').value;
            const res = await fetch('api/horarios/admin_add_curso.php', {
                method: 'POST', body: JSON.stringify({nombre})
            });
            const data = await res.json();
            if(data.success) {
                document.getElementById('nombre-curso').value = '';
                loadCursos();
            }
        });

        async function deleteCurso(id) {
            if(!confirm("¿Eliminar curso y todo su horario?")) return;
            await fetch('api/horarios/admin_delete_curso.php', { method: 'POST', body: JSON.stringify({id}) });
            if(currentCursoId == id) {
                currentCursoId = 0;
                document.getElementById('tabla-horario').style.display = 'none';
            }
            loadCursos();
        }

        // Asignaturas
        async function loadAsignaturas() {
            const res = await fetch('api/horarios/admin_get_asignaturas.php');
            const data = await res.json();
            if(data.success) {
                asignaturas = data.data;
                const ul = document.getElementById('lista-asignaturas');
                const selModal = document.getElementById('modal-select-asignatura');
                ul.innerHTML = '';
                selModal.innerHTML = '<option value="">[ LIBRE ]</option>';
                asignaturas.forEach(a => {
                    ul.innerHTML += `<li style="padding:5px; border-bottom:1px solid #eee; display:flex; justify-content:space-between; align-items:center;">
                        <span style="display:flex; align-items:center; gap:5px;"><span style="width:12px; height:12px; background:${a.color}; border-radius:50%; display:inline-block;"></span> ${a.nombre}</span> 
                        <button onclick="deleteAsignatura(${a.id})" style="color:red; background:none; border:none; cursor:pointer;"><i class="fa fa-trash"></i></button>
                    </li>`;
                    selModal.innerHTML += `<option value="${a.id}">${a.nombre}</option>`;
                });
            }
        }

        document.getElementById('form-asignatura').addEventListener('submit', async(e) => {
            e.preventDefault();
            const nombre = document.getElementById('nombre-asignatura').value;
            const color = document.getElementById('color-asignatura').value;
            const res = await fetch('api/horarios/admin_add_asignatura.php', {
                method: 'POST', body: JSON.stringify({nombre, color})
            });
            const data = await res.json();
            if(data.success) {
                document.getElementById('nombre-asignatura').value = '';
                loadAsignaturas();
                if(currentCursoId) loadHorario(currentCursoId); // Refresh si borramos o algo, pero aquí es añadir
            }
        });

        async function deleteAsignatura(id) {
            if(!confirm("¿Eliminar asignatura? Desaparecerá de todos los horarios.")) return;
            await fetch('api/horarios/admin_delete_asignatura.php', { method: 'POST', body: JSON.stringify({id}) });
            loadAsignaturas();
            if(currentCursoId) loadHorario(currentCursoId);
        }

        // Horario (Grilla)
        function renderTabla() {
            const tbody = document.getElementById('tbody-horario');
            tbody.innerHTML = '';
            
            bloques.forEach(b => {
                const tr = document.createElement('tr');
                if(b.id === 0) {
                    tr.className = 'recreo-row';
                    tr.innerHTML = `<td>${b.hora}</td><td colspan="5" style="letter-spacing:5px;">${b.label}</td>`;
                } else {
                    let html = `<td>${b.hora}<br><small>Bloque ${b.id}</small></td>`;
                    for(let dia = 1; dia <= 5; dia++) {
                        html += `<td><div class="horario-cell empty" id="cell-${dia}-${b.id}" onclick="openModal(${dia}, ${b.id})">+</div></td>`;
                    }
                    tr.innerHTML = html;
                }
                tbody.appendChild(tr);
            });
        }

        document.getElementById('select-curso').addEventListener('change', (e) => {
            currentCursoId = e.target.value;
            if(currentCursoId) {
                document.getElementById('tabla-horario').style.display = 'table';
                loadHorario(currentCursoId);
            } else {
                document.getElementById('tabla-horario').style.display = 'none';
            }
        });

        async function loadHorario(curso_id) {
            // Limpiar tabla
            document.querySelectorAll('.horario-cell').forEach(cell => {
                cell.innerHTML = '+';
                cell.className = 'horario-cell empty';
                cell.style.backgroundColor = 'transparent';
                cell.style.color = 'inherit';
                cell.dataset.asignatura = '';
            });

            const res = await fetch(`api/horarios/admin_get_horario.php?curso_id=${curso_id}`);
            const data = await res.json();
            if(data.success) {
                data.data.forEach(clase => {
                    const cell = document.getElementById(`cell-${clase.dia_semana}-${clase.bloque}`);
                    if(cell) {
                        cell.innerHTML = `<strong>${clase.asignatura_nombre}</strong>`;
                        cell.className = 'horario-cell';
                        cell.style.backgroundColor = clase.color;
                        cell.style.color = '#fff';
                        cell.dataset.asignatura = clase.asignatura_id;
                    }
                });
            }
        }

        // Modal de Asignación
        function openModal(dia, bloque) {
            if(!currentCursoId) return;
            currentModalData = { dia, bloque };
            const diasStr = ["", "Lunes", "Martes", "Miércoles", "Jueves", "Viernes"];
            document.getElementById('modal-info-bloque').textContent = `${diasStr[dia]} - Bloque ${bloque}`;
            
            const cell = document.getElementById(`cell-${dia}-${bloque}`);
            document.getElementById('modal-select-asignatura').value = cell.dataset.asignatura || "";
            
            if(cell.dataset.asignatura) {
                document.getElementById('btn-delete-clase').style.display = 'inline-block';
            } else {
                document.getElementById('btn-delete-clase').style.display = 'none';
            }
            
            document.getElementById('modal-asignar').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modal-asignar').classList.remove('show');
        }

        document.getElementById('btn-save-clase').addEventListener('click', async () => {
            const asignatura_id = document.getElementById('modal-select-asignatura').value;
            
            const payload = {
                curso_id: currentCursoId,
                dia_semana: currentModalData.dia,
                bloque: currentModalData.bloque,
                asignatura_id: asignatura_id
            };
            
            const res = await fetch('api/horarios/admin_save_horario.php', {
                method: 'POST', body: JSON.stringify(payload)
            });
            const data = await res.json();
            if(data.success) {
                closeModal();
                loadHorario(currentCursoId);
            } else {
                alert("Error al guardar: " + data.error);
            }
        });

        document.getElementById('btn-delete-clase').addEventListener('click', async () => {
            if(!confirm("¿Estás seguro de eliminar esta asignatura de este bloque?")) return;
            const payload = {
                curso_id: currentCursoId,
                dia_semana: currentModalData.dia,
                bloque: currentModalData.bloque,
                asignatura_id: "" // Enviar vacío o null lo elimina según nuestro endpoint
            };
            
            const res = await fetch('api/horarios/admin_save_horario.php', {
                method: 'POST', body: JSON.stringify(payload)
            });
            const data = await res.json();
            if(data.success) {
                closeModal();
                loadHorario(currentCursoId);
            } else {
                alert("Error al eliminar: " + data.error);
            }
        });

        document.getElementById('btn-logout').addEventListener('click', async (e) => {
            e.preventDefault();
            await fetch('api/logout.php');
            window.location.href = 'login.html';
        });
    </script>
</body>
</html>
