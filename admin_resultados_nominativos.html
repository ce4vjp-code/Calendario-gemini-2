<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Resultados Nominativos</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background: var(--bg-color); font-family: 'Inter', sans-serif; margin: 0; padding: 0; }
        .header-top { background: var(--primary-color); color: white; padding: 1rem 2rem; display: flex; justify-content: space-between; align-items: center; gap: 1rem; }
        .header-top h2 { margin: 0; font-size: 1.5rem; }
        .header-top .header-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
        .header-top a { color: white; text-decoration: none; font-weight: bold; display: flex; align-items: center; gap: 5px; }
        .main-content { padding: 2rem; max-width: 1200px; margin: 0 auto; box-sizing: border-box; }
        .card { background: white; border-radius: 8px; padding: 2rem; box-shadow: 0 4px 6px rgba(0,0,0,0.05); margin-bottom: 2rem; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 1rem; }
        th, td { padding: 12px 15px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { background: #f8fafc; font-weight: 600; color: var(--text-color); }
        tr:hover { background: #f1f5f9; cursor: pointer; }
        
        /* Modal */
        .modal { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.5); z-index: 1000; justify-content: center; align-items: center; }
        .modal.show { display: flex; }
        .modal-content { background: white; width: 90%; max-width: 800px; max-height: 90vh; border-radius: 8px; padding: 2rem; overflow-y: auto; position: relative; }
        .close-btn { position: absolute; top: 15px; right: 20px; font-size: 1.5rem; cursor: pointer; color: #888; border: none; background: transparent; }
        
        .resp-pregunta { font-weight: 600; margin-top: 1.5rem; margin-bottom: 0.5rem; color: var(--primary-color); border-bottom: 1px solid #eee; padding-bottom: 5px; }
        .resp-valor { margin-left: 10px; color: #444; }

        @media (max-width: 768px) {
            .header-top { flex-direction: column; align-items: flex-start; padding: 1rem; }
            .header-top .header-actions { flex-direction: column; align-items: flex-start; width: 100%; }
            .header-top .header-actions button, .header-top .header-actions a { width: 100%; justify-content: center; text-align: center; padding: 10px; }
            .main-content { padding: 1rem; }
            .card { padding: 1rem; }
        }
    </style>
</head>
<body>
    <div class="header-top">
        <h2>Resultados Individuales</h2>
        <div class="header-actions">
            <button onclick="enviarPorCorreo()" style="background: white; color: var(--primary-color); border: none; padding: 8px 15px; border-radius: 4px; cursor: pointer; font-weight: bold; font-size: 0.9rem;"><i class="fa-solid fa-envelope"></i> Enviar por Correo</button>
            <a href="admin_encuestas.html?tipo=nominativa" style="background: rgba(255,255,255,0.1); padding: 8px 15px; border-radius: 4px; font-size: 0.9rem;"><i class="fa-solid fa-arrow-left"></i> Volver a Encuestas</a>
        </div>
    </div>

    <div class="main-content">
        <div class="card">
            <h3 id="titulo-encuesta">Cargando...</h3>
            <p id="desc-encuesta" style="color: var(--text-muted);"></p>
            
            <div style="margin-top: 2rem; overflow-x: auto;">
                <table id="tabla-resultados">
                    <thead>
                        <tr>
                            <th>Fecha</th>
                            <th>Identificacion (Resumen)</th>
                            <th style="text-align: center;">Accion</th>
                        </tr>
                    </thead>
                    <tbody id="tbody-resultados">
                        <tr><td colspan="3" style="text-align:center;">Cargando respuestas...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <div id="modal-detalle" class="modal">
        <div class="modal-content">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1rem;">
                <h3 style="margin:0;">Detalle de Respuesta</h3>
                <div>
                    <button onclick="imprimirModal()" style="margin-right: 30px; background: var(--primary-color); color: white; border: none; padding: 5px 15px; border-radius: 4px; cursor: pointer;"><i class="fa-solid fa-print"></i> Imprimir</button>
                    <button class="close-btn" onclick="closeModal()" style="position: relative; top: 0; right: 0;">&times;</button>
                </div>
            </div>
            <p style="color: #666; font-size: 0.9rem; margin-top: 0;" id="modal-fecha"></p>
            <div id="modal-respuestas-container" style="margin-top: 1.5rem;"></div>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const encuestaId = urlParams.get('id');
        let globalData = null;

        async function init() {
            if (!encuestaId) {
                alert("ID de encuesta no detectado en la URL. Redirigiendo...");
                window.location.href = 'admin_encuestas.html?tipo=nominativa';
                return;
            }

            try {
                const res = await fetch('api/encuestas/admin_get_resultados_nominativos.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: encuestaId })
                });
                
                if (!res.ok) {
                    alert("Error HTTP: " + res.status);
                    return;
                }
                
                const data = await res.json();
                
                if (data.success) {
                    globalData = data;
                    document.getElementById('titulo-encuesta').textContent = data.encuesta.titulo;
                    document.getElementById('desc-encuesta').textContent = data.encuesta.descripcion || '';
                    
                    renderTable();
                } else {
                    alert("Error: " + data.error);
                }
            } catch (e) {
                alert("Error de conexion: " + e.message);
            }
        }

        function renderTable() {
            const tbody = document.getElementById('tbody-resultados');
            tbody.innerHTML = '';
            
            if (!globalData.submissions || globalData.submissions.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">No hay respuestas aun.</td></tr>';
                return;
            }

            globalData.submissions.forEach((sub, index) => {
                let identificacion = "Respuesta #" + (globalData.submissions.length - index);
                
                const primeraPreguntaTexto = globalData.preguntas.find(p => p.tipo_pregunta === 'texto');
                if (primeraPreguntaTexto && sub.respuestas[primeraPreguntaTexto.id]) {
                    identificacion = sub.respuestas[primeraPreguntaTexto.id];
                }

                const tr = document.createElement('tr');
                tr.onclick = () => showDetalle(sub.id);
                tr.innerHTML = `
                    <td>${sub.fecha}</td>
                    <td><strong>${identificacion}</strong></td>
                    <td style="text-align: center;">
                        <button class="btn-action primary" style="padding: 5px 15px; border:none; background:var(--primary-color); color:white; border-radius:4px; cursor:pointer;">
                            Ver Todo
                        </button>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function showDetalle(submissionId) {
            const sub = globalData.submissions.find(s => s.id === submissionId);
            if (!sub) return;

            document.getElementById('modal-fecha').textContent = "Fecha de envio: " + sub.fecha;
            
            const cont = document.getElementById('modal-respuestas-container');
            cont.innerHTML = '';

            let i = 1;
            globalData.preguntas.forEach(p => {
                if (p.tipo_pregunta === 'seccion') {
                    cont.innerHTML += `<h4 style="color:var(--primary-color); margin-top:2rem; border-bottom:2px solid var(--border-color); padding-bottom:5px;">${p.texto_pregunta}</h4>`;
                    return;
                }
                if (p.tipo_pregunta === 'descripcion_corta') {
                    cont.innerHTML += `<p style="font-style:italic; color:#666; margin-bottom:1rem;">${p.texto_pregunta}</p>`;
                    return;
                }

                const div = document.createElement('div');
                const respuesta = sub.respuestas[p.id] || '<span style="color:#aaa; font-style:italic;">Sin responder</span>';
                
                div.innerHTML = `
                    <div class="resp-pregunta">${i}. ${p.texto_pregunta}</div>
                    <div class="resp-valor">${respuesta}</div>
                `;
                cont.appendChild(div);
                i++;
            });

            document.getElementById('modal-detalle').classList.add('show');
        }

        function closeModal() {
            document.getElementById('modal-detalle').classList.remove('show');
        }

        function imprimirModal() {
            const contenido = document.getElementById('modal-respuestas-container').innerHTML;
            const fecha = document.getElementById('modal-fecha').textContent;
            const titulo = document.getElementById('titulo-encuesta').textContent;
            
            const ventana = window.open('', '', 'width=800,height=600');
            ventana.document.write(`
                <html>
                <head>
                    <title>Imprimir Respuesta - ${titulo}</title>
                    <style>
                        body { font-family: sans-serif; padding: 20px; color: #333; }
                        h2 { color: #000; border-bottom: 2px solid #ddd; padding-bottom: 10px; }
                        .resp-pregunta { font-weight: bold; margin-top: 15px; margin-bottom: 5px; color: #444; border-bottom: 1px solid #eee; padding-bottom: 5px; }
                        .resp-valor { margin-left: 10px; color: #000; }
                    </style>
                </head>
                <body>
                    <h2>${titulo}</h2>
                    <p style="color: #666; font-style: italic;">${fecha}</p>
                    ${contenido}
                </body>
                </html>
            `);
            ventana.document.close();
            ventana.focus();
            setTimeout(() => {
                ventana.print();
                ventana.close();
            }, 500);
        }

        async function enviarPorCorreo() {
            const email = prompt("Introduce el correo electronico al que deseas enviar los resultados de esta encuesta:");
            if (!email || !email.includes('@')) {
                if(email !== null) alert("Por favor, introduce un correo valido.");
                return;
            }

            try {
                const res = await fetch('api/encuestas/admin_send_resultados_email.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ id: encuestaId, email: email })
                });
                
                const data = await res.json();
                if (data.success) {
                    alert("Resultados enviados exitosamente a " + email);
                } else {
                    alert("Error al enviar correo: " + data.error);
                }
            } catch (e) {
                alert("Error de conexion al intentar enviar el correo.");
            }
        }

        init();
    </script>
</body>
</html>
