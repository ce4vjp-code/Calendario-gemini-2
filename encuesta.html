<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <style>
        :root {
            --form-bg: #f8f9fa;
            --card-bg: #ffffff;
            --primary-accent: #2c3e50;
            --secondary-accent: #34495e;
            --text-dark: #2b2b2b;
            --text-gray: #6c757d;
            --border-light: #e9ecef;
            --focus-ring: rgba(44, 62, 80, 0.25);
        }

        body { 
            padding: 2rem 1rem; 
            background-color: var(--form-bg); 
            display: flex; 
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh; 
            height: auto !important;
            overflow: auto !important;
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            margin: 0;
        }

        .public-container { 
            background: var(--card-bg); 
            padding: 3rem 2.5rem; 
            border-radius: 12px; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.08); 
            width: 100%;
            max-width: 750px; 
            border-top: 6px solid var(--primary-accent);
        }
        
        .header-logo { 
            text-align: center; 
            margin-bottom: 2rem; 
        }
        .header-logo img { 
            height: 70px; 
            object-fit: contain;
        }
        
        h1 { 
            color: var(--primary-accent); 
            margin-bottom: 0.75rem; 
            text-align: center; 
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .desc { 
            color: var(--text-gray); 
            text-align: justify; 
            margin-bottom: 2.5rem; 
            font-size: 1.1rem; 
            line-height: 1.6;
            padding: 0 1rem;
        }
        
        .pregunta-card { 
            background: #ffffff; 
            padding: 2rem; 
            border: 1px solid var(--border-light); 
            border-radius: 8px; 
            margin-bottom: 1.8rem; 
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }
        
        .pregunta-card:hover {
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border-color: #dee2e6;
        }

        .pregunta-texto { 
            font-weight: 600; 
            font-size: 1.15rem; 
            margin-bottom: 1.2rem; 
            color: var(--primary-accent); 
        }
        
        .input-texto { 
            width: 100%; 
            padding: 0.85rem 1rem; 
            border: 1px solid #ced4da; 
            border-radius: 6px; 
            font-family: 'Inter', sans-serif; 
            font-size: 1rem; 
            transition: all 0.2s ease;
            background-color: #fcfcfc;
            box-sizing: border-box;
        }

        .input-texto:focus {
            outline: none;
            border-color: var(--primary-accent);
            box-shadow: 0 0 0 3px var(--focus-ring);
            background-color: #ffffff;
        }
        
        textarea.input-texto {
            resize: vertical;
            min-height: 100px;
        }
        
        .radio-opcion { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin-bottom: 1rem; 
            font-size: 1.05rem; 
            cursor: pointer; 
            padding: 0.5rem;
            border-radius: 6px;
            transition: background-color 0.2s;
        }
        
        .radio-opcion:hover {
            background-color: #f8f9fa;
        }

        .radio-opcion input[type="radio"],
        .radio-opcion input[type="checkbox"] { 
            cursor: pointer; 
            width: 20px; 
            height: 20px; 
            flex-shrink: 0;
            accent-color: var(--primary-accent);
        }
        
        .encabezado-seccion { 
            font-size: 1.6rem; 
            font-weight: 700; 
            color: var(--secondary-accent); 
            margin-top: 3rem; 
            margin-bottom: 1.2rem; 
            border-bottom: 2px solid var(--border-light); 
            padding-bottom: 0.75rem; 
        }
        
        .descripcion-corta-seccion { 
            font-size: 1.05rem; 
            color: var(--text-gray); 
            margin-top: 1rem; 
            margin-bottom: 1.5rem; 
            line-height: 1.6;
        }
        
        .error-msg { 
            text-align: center; 
            color: #dc3545; 
            font-size: 1.1rem; 
            margin-top: 2rem; 
            font-weight: 600; 
            padding: 1rem;
            background-color: #fff5f5;
            border-radius: 6px;
            border: 1px solid #ffc9c9;
        }
        
        .success-screen { 
            text-align: center; 
            padding: 4rem 2rem; 
            display: none; 
        }
        .success-screen i { 
            font-size: 4.5rem; 
            color: #198754; 
            margin-bottom: 1.5rem; 
        }
        .success-screen h2 { 
            color: var(--primary-accent); 
            margin-bottom: 1rem; 
            font-size: 2rem;
        }
        .success-screen p {
            color: var(--text-gray);
            font-size: 1.1rem;
        }

        /* Botón de Enviar */
        #btn-submit-encuesta {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 2rem;
            background-color: var(--primary-accent);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        #btn-submit-encuesta:hover {
            background-color: var(--secondary-accent);
        }

        #btn-submit-encuesta:active {
            transform: scale(0.98);
        }
        
        /* Ajuste móvil */
        @media (max-width: 600px) {
            .public-container {
                padding: 2rem 1.5rem;
            }
            .pregunta-card {
                padding: 1.5rem 1rem;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="public-container">
        <div class="header-logo">
            <img src="logo.png" alt="Logo de la Institución">
        </div>
        
        <div id="cargando" style="text-align:center; color:#888;">Cargando encuesta...</div>
        <div id="error-container" class="error-msg" style="display:none;"></div>
        
        <div id="encuesta-container" style="display:none;">
            <h1 id="enc-titulo"></h1>
            <p id="enc-desc" class="desc"></p>
            
            <form id="form-respuestas">
                <div id="preguntas-list"></div>
                
                <button type="submit" class="btn-submit" style="width: 100%; font-size: 1.1rem; margin-top: 2rem;" id="btn-enviar">
                    Enviar Respuestas
                </button>
            </form>
        </div>
        
        <div id="success-container" class="success-screen">
            <i class="fa-solid fa-circle-check"></i>
            <h2>¡Gracias por tu participación!</h2>
            <p id="msg-exito" style="color: var(--text-muted);">Tus respuestas han sido enviadas.</p>
            <p style="margin-top:2rem; font-size:0.9rem; color:#aaa;">Ya puedes cerrar esta ventana.</p>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');
        
        let preguntasGlobal = [];
        let globalData = null;

        function formatMarkdown(text) {
            if (!text) return '';
            // Escapar HTML básico primero
            let html = text.replace(/</g, '&lt;').replace(/>/g, '&gt;');
            // Headers
            html = html.replace(/^### (.*$)/gim, '<h3>$1</h3>');
            html = html.replace(/^## (.*$)/gim, '<h2>$1</h2>');
            html = html.replace(/^# (.*$)/gim, '<h1>$1</h1>');
            // Bold
            html = html.replace(/\*\*(.*?)\*\*/g, '<strong>$1</strong>');
            // Italic
            html = html.replace(/\*(.*?)\*/g, '<em>$1</em>');
            // Newlines
            html = html.replace(/\n/g, '<br>');
            return html;
        }

        async function init() {
            if(!token) {
                showError("No se proporcionó un enlace válido.");
                return;
            }
            
            try {
                const res = await fetch('api/encuestas/public_get_encuesta.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token })
                });
                const data = await res.json();
                
                document.getElementById('cargando').style.display = 'none';
                
                if(data.success) {
                    globalData = data;
                    preguntasGlobal = data.preguntas;
                    document.getElementById('enc-titulo').innerHTML = formatMarkdown(data.encuesta.titulo);
                    document.getElementById('enc-desc').innerHTML = formatMarkdown(data.encuesta.descripcion);
                    
                    const btnEnviar = document.getElementById('btn-enviar');
                    if (data.encuesta.tipo_encuesta === 'anonima' || !data.encuesta.tipo_encuesta) {
                        btnEnviar.innerText = 'Enviar Respuestas de Forma Anónima';
                    } else {
                        btnEnviar.innerText = 'Enviar Respuestas';
                    }
                    
                    const lista = document.getElementById('preguntas-list');
                    let preguntaNum = 1;
                    
                    data.preguntas.forEach((p, idx) => {
                        if (p.tipo_pregunta === 'seccion') {
                            const seccionDiv = document.createElement('div');
                            seccionDiv.className = 'encabezado-seccion';
                            seccionDiv.innerHTML = formatMarkdown(p.texto_pregunta);
                            lista.appendChild(seccionDiv);
                            return; // continua al siguiente elemento
                        } else if (p.tipo_pregunta === 'descripcion_corta') {
                            const descDiv = document.createElement('div');
                            descDiv.className = 'descripcion-corta-seccion';
                            descDiv.innerHTML = formatMarkdown(p.texto_pregunta);
                            lista.appendChild(descDiv);
                            return; // continua al siguiente elemento
                        }

                        const card = document.createElement('div');
                        card.className = 'pregunta-card';
                        
                        let html = `<div class="pregunta-texto">${preguntaNum}. ${formatMarkdown(p.texto_pregunta)}</div>`;
                        preguntaNum++;
                        
                        if(p.tipo_pregunta === 'texto') {
                            html += `<textarea class="input-texto" id="resp-${p.id}" rows="3" placeholder="Escribe tu respuesta aquí..." required></textarea>`;
                        } else if (p.tipo_pregunta === 'opcion_multiple') {
                            p.opciones.forEach((op, opIdx) => {
                                html += `
                                    <label class="radio-opcion">
                                        <input type="radio" name="resp-${p.id}" value="${op.replace(/"/g, '&quot;')}" required>
                                        <span>${op}</span>
                                    </label>
                                `;
                            });
                            if (p.incluye_otro) {
                                html += `
                                    <label class="radio-opcion" style="flex-wrap: wrap;">
                                        <input type="radio" name="resp-${p.id}" value="OTRO" required>
                                        <span>Otro: </span>
                                        <input type="text" id="otro-texto-${p.id}" class="input-texto" style="padding: 0.25rem 0.5rem; margin-left: 5px; flex: 1; min-width: 150px;" onclick="document.querySelector('input[name=resp-${p.id}][value=OTRO]').checked = true;" placeholder="Especifique...">
                                    </label>
                                `;
                            }
                            if (p.incluye_justificacion) {
                                html += `
                                    <label class="radio-opcion" style="flex-wrap: wrap;">
                                        <input type="radio" name="resp-${p.id}" value="JUSTIFICACION" required>
                                        <span>Justifique su respuesta: </span>
                                        <input type="text" id="just-texto-${p.id}" class="input-texto" style="padding: 0.25rem 0.5rem; margin-left: 5px; flex: 1; min-width: 150px;" onclick="document.querySelector('input[name=resp-${p.id}][value=JUSTIFICACION]').checked = true;" placeholder="Especifique...">
                                    </label>
                                `;
                            }
                        } else if (p.tipo_pregunta === 'seleccion_multiple') {
                            p.opciones.forEach((op, opIdx) => {
                                html += `
                                    <label class="radio-opcion">
                                        <input type="checkbox" name="resp-${p.id}" value="${op.replace(/"/g, '&quot;')}">
                                        <span>${op}</span>
                                    </label>
                                `;
                            });
                            if (p.incluye_otro) {
                                html += `
                                    <label class="radio-opcion" style="flex-wrap: wrap;">
                                        <input type="checkbox" name="resp-${p.id}" value="OTRO">
                                        <span>Otro: </span>
                                        <input type="text" id="otro-texto-${p.id}" class="input-texto" style="padding: 0.25rem 0.5rem; margin-left: 5px; flex: 1; min-width: 150px;" onclick="document.querySelector('input[name=resp-${p.id}][value=OTRO]').checked = true;" placeholder="Especifique...">
                                    </label>
                                `;
                            }
                            if (p.incluye_justificacion) {
                                html += `
                                    <label class="radio-opcion" style="flex-wrap: wrap;">
                                        <input type="checkbox" name="resp-${p.id}" value="JUSTIFICACION">
                                        <span>Justifique su respuesta: </span>
                                        <input type="text" id="just-texto-${p.id}" class="input-texto" style="padding: 0.25rem 0.5rem; margin-left: 5px; flex: 1; min-width: 150px;" onclick="document.querySelector('input[name=resp-${p.id}][value=JUSTIFICACION]').checked = true;" placeholder="Especifique...">
                                    </label>
                                `;
                            }
                        } else if (p.tipo_pregunta === 'menu_desplegable') {
                            html += `<select class="input-texto" id="resp-${p.id}" required>
                                        <option value="" disabled selected>Selecciona una opción...</option>`;
                            p.opciones.forEach((op) => {
                                html += `<option value="${op.replace(/"/g, '&quot;')}">${op}</option>`;
                            });
                            html += `</select>`;
                        }
                        
                        card.innerHTML = html;
                        lista.appendChild(card);
                    });
                    
                    document.getElementById('encuesta-container').style.display = 'block';
                } else {
                    showError(data.error);
                }
            } catch(e) {
                showError("Error de conexión al cargar la encuesta.");
            }
        }
        
        function showError(msg) {
            document.getElementById('cargando').style.display = 'none';
            document.getElementById('encuesta-container').style.display = 'none';
            const err = document.getElementById('error-container');
            err.innerHTML = `<i class="fa-solid fa-triangle-exclamation"></i><br>${msg}`;
            err.style.display = 'block';
        }

        document.getElementById('form-respuestas').addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const btn = document.getElementById('btn-enviar');
            btn.disabled = true;
            btn.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Enviando...';
            
            let respuestas = [];
            let isValid = true;
            
            preguntasGlobal.forEach(p => {
                if (p.tipo_pregunta === 'seccion' || p.tipo_pregunta === 'descripcion_corta') return;
                
                let valor = '';
                if(p.tipo_pregunta === 'texto') {
                    valor = document.getElementById(`resp-${p.id}`).value;
                } else if (p.tipo_pregunta === 'opcion_multiple') {
                    const radios = document.getElementsByName(`resp-${p.id}`);
                    for(let r of radios) {
                        if(r.checked) {
                            if (r.value === 'OTRO') {
                                valor = document.getElementById(`otro-texto-${p.id}`).value;
                            } else if (r.value === 'JUSTIFICACION') {
                                valor = document.getElementById(`just-texto-${p.id}`).value;
                            } else {
                                valor = r.value;
                            }
                            break;
                        }
                    }
                } else if (p.tipo_pregunta === 'seleccion_multiple') {
                    const checks = document.getElementsByName(`resp-${p.id}`);
                    let selected = [];
                    for(let c of checks) {
                        if(c.checked) {
                            if (c.value === 'OTRO') {
                                const txt = document.getElementById(`otro-texto-${p.id}`).value;
                                if(txt.trim() !== '') selected.push(txt.trim());
                            } else if (c.value === 'JUSTIFICACION') {
                                const txt = document.getElementById(`just-texto-${p.id}`).value;
                                if(txt.trim() !== '') selected.push("Justificacion: " + txt.trim());
                            } else {
                                selected.push(c.value);
                            }
                        }
                    }
                    if(selected.length === 0) {
                        isValid = false;
                    } else {
                        selected.forEach(v => {
                            respuestas.push({ pregunta_id: p.id, valor: v });
                        });
                    }
                    return;
                } else if (p.tipo_pregunta === 'menu_desplegable') {
                    valor = document.getElementById(`resp-${p.id}`).value;
                }
                
                if (valor.trim() === '') {
                    isValid = false;
                }
                
                respuestas.push({
                    pregunta_id: p.id,
                    valor: valor
                });
            });

            if (!isValid) {
                alert("Por favor, asegúrate de responder todas las preguntas antes de enviar.");
                btn.disabled = false;
                
                if (globalData && globalData.encuesta && globalData.encuesta.tipo_encuesta === 'nominativa') {
                    btn.innerHTML = 'Enviar Respuestas';
                } else {
                    btn.innerHTML = 'Enviar Respuestas de Forma Anónima';
                }
                return;
            }
            
            try {
                const res = await fetch('api/encuestas/public_submit_respuesta.php', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ token, respuestas })
                });
                const data = await res.json();
                
                if(data.success) {
                    if (globalData.encuesta.tipo_encuesta === 'anonima' || !globalData.encuesta.tipo_encuesta) {
                        document.getElementById('msg-exito').innerText = 'Tus respuestas han sido enviadas de forma 100% anónima.';
                    } else {
                        document.getElementById('msg-exito').innerText = 'Tus respuestas han sido registradas exitosamente.';
                    }
                    document.getElementById('encuesta-container').style.display = 'none';
                    document.getElementById('success-container').style.display = 'block';
                } else {
                    alert("Error: " + data.error);
                    btn.disabled = false;
                    btn.innerHTML = 'Intentar de Nuevo';
                }
            } catch (error) {
                alert("Error de conexión: " + error.message);
                btn.disabled = false;
                btn.innerHTML = 'Intentar de Nuevo';
            }
        });

        init();
    </script>
<script src="scrolltop.js?v=2"></script>`n</body>
</html>
