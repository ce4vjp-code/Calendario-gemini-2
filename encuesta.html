<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Encuesta</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="gforms_style.css">
    <style>
        :root {
            --form-bg: #f8f9fa;
            --card-bg: #ffffff;
            --primary-accent: #2c3e50;
            --secondary-accent: #34495e;
            --text-dark: #2b2b2b;
            --text-gray: #6c757d;
            --border-light: #e9ecef;
            --focus-ring: rgba(44, 62, 80, 0.25);
        }

        body { 
            padding: 2rem 1rem; 
            background-color: var(--form-bg); 
            display: flex; 
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh; 
            height: auto !important;
            overflow: auto !important;
            font-family: 'Inter', sans-serif;
            color: var(--text-dark);
            margin: 0;
        }

        .public-container { 
            background: var(--card-bg); 
            padding: 3rem 2.5rem; 
            border-radius: 12px; 
            box-shadow: 0 8px 30px rgba(0,0,0,0.08); 
            width: 100%;
            max-width: 750px; 
            border-top: 6px solid var(--primary-accent);
        }
        
        .header-logo { 
            text-align: center; 
            margin-bottom: 2rem; 
        }
        .header-logo img { 
            height: 70px; 
            object-fit: contain;
        }
        
        h1 { 
            color: var(--primary-accent); 
            margin-bottom: 0.75rem; 
            text-align: center; 
            font-size: 2.2rem;
            font-weight: 700;
            letter-spacing: -0.5px;
        }
        
        .desc { 
            color: var(--text-gray); 
            text-align: justify; 
            margin-bottom: 2.5rem; 
            font-size: 1.1rem; 
            line-height: 1.6;
            padding: 0 1rem;
        }
        
        .pregunta-card { 
            background: #ffffff; 
            padding: 2rem; 
            border: 1px solid var(--border-light); 
            border-radius: 8px; 
            margin-bottom: 1.8rem; 
            transition: box-shadow 0.2s ease, border-color 0.2s ease;
        }
        
        .pregunta-card:hover {
            box-shadow: 0 4px 15px rgba(0,0,0,0.03);
            border-color: #dee2e6;
        }

        .pregunta-texto { 
            font-weight: 600; 
            font-size: 1.15rem; 
            margin-bottom: 1.2rem; 
            color: var(--primary-accent); 
        }
        
        .input-texto { 
            width: 100%; 
            padding: 0.85rem 1rem; 
            border: 1px solid #ced4da; 
            border-radius: 6px; 
            font-family: 'Inter', sans-serif; 
            font-size: 1rem; 
            transition: all 0.2s ease;
            background-color: #fcfcfc;
            box-sizing: border-box;
        }

        .input-texto:focus {
            outline: none;
            border-color: var(--primary-accent);
            box-shadow: 0 0 0 3px var(--focus-ring);
            background-color: #ffffff;
        }
        
        textarea.input-texto {
            resize: vertical;
            min-height: 100px;
        }
        
        .radio-opcion { 
            display: flex; 
            align-items: center; 
            gap: 12px; 
            margin-bottom: 1rem; 
            font-size: 1.05rem; 
            cursor: pointer; 
            padding: 0.5rem;
            border-radius: 6px;
            transition: background-color 0.2s;
        }
        
        .radio-opcion:hover {
            background-color: #f8f9fa;
        }

        .radio-opcion input[type="radio"],
        .radio-opcion input[type="checkbox"] { 
            cursor: pointer; 
            width: 20px; 
            height: 20px; 
            flex-shrink: 0;
            accent-color: var(--primary-accent);
        }
        
        .encabezado-seccion { 
            font-size: 1.6rem; 
            font-weight: 700; 
            color: var(--secondary-accent); 
            margin-top: 3rem; 
            margin-bottom: 1.2rem; 
            border-bottom: 2px solid var(--border-light); 
            padding-bottom: 0.75rem; 
        }
        
        .descripcion-corta-seccion { 
            font-size: 1.05rem; 
            color: var(--text-gray); 
            margin-top: 1rem; 
            margin-bottom: 1.5rem; 
            line-height: 1.6;
        }
        
        .error-msg { 
            text-align: center; 
            color: #dc3545; 
            font-size: 1.1rem; 
            margin-top: 2rem; 
            font-weight: 600; 
            padding: 1rem;
            background-color: #fff5f5;
            border-radius: 6px;
            border: 1px solid #ffc9c9;
        }
        
        .success-screen { 
            text-align: center; 
            padding: 4rem 2rem; 
            display: none; 
        }
        .success-screen i { 
            font-size: 4.5rem; 
            color: #198754; 
            margin-bottom: 1.5rem; 
        }
        .success-screen h2 { 
            color: var(--primary-accent); 
            margin-bottom: 1rem; 
            font-size: 2rem;
        }
        .success-screen p {
            color: var(--text-gray);
            font-size: 1.1rem;
        }

        /* Botón de Enviar */
        #btn-submit-encuesta {
            width: 100%;
            padding: 1rem;
            font-size: 1.1rem;
            font-weight: 600;
            margin-top: 2rem;
            background-color: var(--primary-accent);
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            transition: background-color 0.2s, transform 0.1s;
        }

        #btn-submit-encuesta:hover {
            background-color: var(--secondary-accent);
        }

        #btn-submit-encuesta:active {
            transform: scale(0.98);
        }
        
        /* Ajuste móvil */
        @media (max-width: 600px) {
            .public-container {
                padding: 2rem 1.5rem;
            }
            .pregunta-card {
                padding: 1.5rem 1rem;
            }
            h1 {
                font-size: 1.8rem;
            }
        }
    </style>
</head>
<body>
    <div class="public-container">
        <div class="header-logo">
            <img src="logo.png" alt="Logo de la Institución">
        </div>
        
        <div id="cargando" style="text-align:center; color:#888;">Cargando encuesta...</div>
        <div id="error-container" class="error-msg" style="display:none;"></div>
        
        <div id="encuesta-container" style="display:none;">
            <h1 id="enc-titulo"></h1>
            <p id="enc-desc" class="desc"></p>
            
            <form id="form-respuestas">
                <div id="preguntas-list"></div>
                
                <button type="submit" class="btn-submit" style="width: 100%; font-size: 1.1rem; margin-top: 2rem;" id="btn-enviar">
                    Enviar Respuestas
                </button>
            </form>
        </div>
        
        <div id="success-container" class="success-screen">
            <i class="fa-solid fa-circle-check"></i>
            <h2>¡Gracias por tu participación!</h2>
            <p id="msg-exito" style="color: var(--text-muted);">Tus respuestas han sido enviadas.</p>
            <p style="margin-top:2rem; font-size:0.9rem; color:#aaa;">Ya puedes cerrar esta ventana.</p>
        </div>
    </div>

    
<script src="scrolltop.js?v=2"></script>
<script src="encuesta_script.js?v=2"></script>
</body>
</html>
