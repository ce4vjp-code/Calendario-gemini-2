<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página de Pruebas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .container {
            background-color: #fff;
            padding: 2rem;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            text-align: center;
            max-width: 500px;
        }
        h1 {
            color: #0056b3;
        }
        p {
            line-height: 1.6;
        }
        button {
            background-color: #0056b3;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 16px;
            border-radius: 4px;
            cursor: pointer;
            margin-top: 15px;
        }
        button:hover {
            background-color: #004494;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Entorno de Pruebas</h1>
        <p>Este es un archivo <strong>index.html</strong> básico creado en una carpeta separada para que puedas realizar tus pruebas sin afectar el proyecto principal del Calendario.</p>
        <button onclick="saludar()">Haz clic aquí para probar JavaScript</button>
    </div>

    <script>
        function saludar() {
            alert('¡JavaScript está funcionando correctamente en tu página de pruebas!');
        }
    </script>
</body>
</html>
