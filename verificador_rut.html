<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Verificador de RUT</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap');

        :root {
            --primary: #4F46E5;
            --primary-hover: #4338CA;
            --bg-color: #0F172A;
            --card-bg: rgba(30, 41, 59, 0.7);
            --text-color: #F8FAFC;
            --text-muted: #94A3B8;
            --success: #10B981;
            --error: #EF4444;
        }

        body {
            margin: 0;
            padding: 0;
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background: linear-gradient(135deg, #0F172A 0%, #1E1B4B 100%);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        .container {
            width: 100%;
            max-width: 400px;
            padding: 2.5rem 2rem;
            background: var(--card-bg);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 1.5rem;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            transition: transform 0.3s ease;
            box-sizing: border-box;
            margin: 1rem;
        }

        .container:hover {
            transform: translateY(-5px);
        }

        h1 {
            text-align: center;
            font-size: 1.75rem;
            margin-top: 0;
            margin-bottom: 0.5rem;
            background: linear-gradient(to right, #818CF8, #C084FC);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            font-weight: 600;
        }

        p.subtitle {
            text-align: center;
            color: var(--text-muted);
            margin-bottom: 2rem;
            font-size: 0.9rem;
        }

        .input-group {
            position: relative;
            margin-bottom: 1.5rem;
        }

        input {
            width: 100%;
            padding: 1rem;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 0.75rem;
            color: var(--text-color);
            font-size: 1.1rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
            outline: none;
            text-align: center;
            letter-spacing: 1px;
        }

        input:focus {
            border-color: var(--primary);
            box-shadow: 0 0 0 3px rgba(79, 70, 229, 0.2);
            background: rgba(15, 23, 42, 0.8);
        }

        input::placeholder {
            color: rgba(148, 163, 184, 0.4);
            letter-spacing: normal;
        }

        button {
            width: 100%;
            padding: 1rem;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 0.75rem;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1), 0 2px 4px -1px rgba(0, 0, 0, 0.06);
        }

        button:hover {
            background: var(--primary-hover);
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(79, 70, 229, 0.4);
        }

        button:active {
            transform: translateY(0);
        }

        #result {
            margin-top: 1.5rem;
            padding: 1rem;
            border-radius: 0.75rem;
            text-align: center;
            font-weight: 500;
            opacity: 0;
            transform: translateY(10px);
            transition: all 0.4s ease;
            display: none;
            font-size: 0.95rem;
        }

        #result.show {
            opacity: 1;
            transform: translateY(0);
            display: block;
        }

        #result.valid {
            background: rgba(16, 185, 129, 0.1);
            color: var(--success);
            border: 1px solid rgba(16, 185, 129, 0.2);
        }

        #result.invalid {
            background: rgba(239, 68, 68, 0.1);
            color: var(--error);
            border: 1px solid rgba(239, 68, 68, 0.2);
        }
        
        .format-hint {
            display: block;
            margin-top: 0.75rem;
            font-size: 0.8rem;
            color: var(--text-muted);
            text-align: center;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Verificador de RUT</h1>
        <p class="subtitle">Validación mediante algoritmo Módulo 11</p>

        <div class="input-group">
            <input type="text" id="rutInput" placeholder="Ej: 12.345.678-9" autocomplete="off" maxlength="12">
            <span class="format-hint">Puede ingresar el RUT con o sin puntos y guión.</span>
        </div>

        <button onclick="verifyRUT()">Verificar RUT</button>

        <div id="result"></div>
    </div>

    <script>
        const rutInput = document.getElementById('rutInput');

        // Formatear RUT mientras el usuario escribe
        rutInput.addEventListener('input', function(e) {
            let value = e.target.value.replace(/[^0-9kK]/g, '');
            if (value.length > 1) {
                let body = value.slice(0, -1);
                let dv = value.slice(-1).toUpperCase();
                
                // Agregar puntos al cuerpo
                body = body.replace(/\B(?=(\d{3})+(?!\d))/g, '.');
                e.target.value = body + '-' + dv;
            } else {
                e.target.value = value.toUpperCase();
            }
        });

        // Permitir verificar con Enter
        rutInput.addEventListener('keypress', function(e) {
            if (e.key === 'Enter') {
                verifyRUT();
            }
        });

        function verifyRUT() {
            const rutValue = rutInput.value;
            
            // Limpiar RUT de puntos y guion
            const cleanRut = rutValue.replace(/[^0-9kK]/g, '').toUpperCase();
            
            // Validaciones básicas
            if (cleanRut.length < 2) {
                showResult('Por favor, ingrese un RUT válido.', false);
                return;
            }

            const body = cleanRut.slice(0, -1);
            const dv = cleanRut.slice(-1);

            // Validar que el cuerpo sea solo números y que no sea todo ceros
            if (!/^[0-9]+$/.test(body) || parseInt(body) === 0) {
                showResult('El cuerpo del RUT no es válido.', false);
                return;
            }

            // Calcular Digito Verificador (Módulo 11)
            let sum = 0;
            let multiplier = 2;

            // Recorrer de derecha a izquierda
            for (let i = body.length - 1; i >= 0; i--) {
                sum += parseInt(body.charAt(i)) * multiplier;
                multiplier = multiplier < 7 ? multiplier + 1 : 2;
            }

            const expectedDv = 11 - (sum % 11);
            let calculatedDv;
            if (expectedDv === 11) {
                calculatedDv = '0';
            } else if (expectedDv === 10) {
                calculatedDv = 'K';
            } else {
                calculatedDv = expectedDv.toString();
            }

            if (dv === calculatedDv) {
                showResult('El RUT es Válido ✅', true);
            } else {
                showResult('El RUT es Inválido ❌', false);
            }
        }

        function showResult(message, isValid) {
            const resultDiv = document.getElementById('result');
            resultDiv.textContent = message;
            resultDiv.className = ''; // reset classes
            
            // Forzar reflujo para reiniciar la animación
            void resultDiv.offsetWidth;
            
            resultDiv.classList.add('show');
            resultDiv.classList.add(isValid ? 'valid' : 'invalid');
        }
    </script>
</body>
</html>
